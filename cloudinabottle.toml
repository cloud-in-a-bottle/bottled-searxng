[app]
name = "searxng"
version = "1.0.0"
description = "SearXNG privacy-respecting metasearch engine"

[runtime.container]
image = "Dockerfile"
# Cloud in a Bottle pulls this signed prebuilt image (built from the release tag's commit by CI) instead of building
# `image`. If you fork this app and change it, comment this line out so your instance builds `image` instead.
prebuilt_image = "registry.cloudinabottle.org/bottled-searxng"
port = 3000

[routing]
public_paths = ["/"]

[resources]
memory_mb = 512
cpu_cores = 0.25

[data]
app_data = true
